name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller requests pycryptodome pywin32
          if (Test-Path requirements.txt) { pip install -r requirements.txt }

      - name: Build EXE
        run: pyinstaller --onefile --hidden-import=requests --hidden-import=Crypto.Cipher.AES --hidden-import=win32crypt --collect-all=requests --collect-all=Crypto Hello.py

      - name: Copy EXE to root folder
        shell: pwsh
        run: Copy-Item -Path "dist\Hello.exe" -Destination ".\Hello.exe" -Force

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            dist/*.exe
            Hello.exe
